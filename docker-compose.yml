version: '3.8'

services:
  isl-translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: isl_two_way_translator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      # Optional: mount checkpoints and tflite models if you want hot-reloading of weights
      - ./checkpoints:/app/checkpoints
      - ./tflite_models:/app/tflite_models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
